name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Arrange project files
        run: |
          mkdir -p app/src/main/java/com/example/talkingtimer
          mv -f MainActivity.kt TimerService.kt app/src/main/java/com/example/talkingtimer/
          mv -f AndroidManifest.xml app/src/main/
          mv -f app-build.gradle.kts app/build.gradle.kts

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
